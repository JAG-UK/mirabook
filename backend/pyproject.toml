[project]
name = "mirabook-backend"
version = "0.1.0"
description = "Mirabook backend — side-by-side AI translation reading aid"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Real optional features of the shipped package: install one to use that
# translation provider.
anthropic = ["anthropic>=1.0"]
openai = ["openai>=3.0"]

# Tooling, not a feature of the package. As an optional-dependency it was an
# extra nobody installed unless they knew to, so a fresh checkout — CI's, or a
# new contributor's — had no pytest and no ruff. A dependency group is
# installed by `uv sync` and `uv run` without being asked, which is what a
# development requirement should do.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
